name: Deploy landing page
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source revision to deploy
        type: string
        required: false
      release_tag:
        description: Published release to display
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-22.04
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Verify static site
        run: |
          test -f website/index.html
          test -f website/downloads.js
          test -f website/assets/icon.png
          test -f website/assets/screenshots/overview.png
          test -f website/assets/screenshots/fleet-home.png
          test -f website/assets/screenshots/docker.png
          test -f website/assets/screenshots/files.png
          test -f website/assets/screenshots/terminal.png
          test -f website/assets/fonts/manrope-latin-wght-normal.woff2
          ! grep -q '/src/main.tsx' website/index.html
      - name: Generate public download manifest
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            let manifest = null;
            try {
              const tag = process.env.RELEASE_TAG;
              const response = tag
                ? await github.rest.repos.getReleaseByTag({owner, repo, tag})
                : await github.rest.repos.getLatestRelease({owner, repo});
              const release = response.data;
              if (release.draft || release.prerelease) throw new Error('Release is not published');
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner, repo, release_id: release.id, per_page: 100
              });
              manifest = {
                tag_name: release.tag_name,
                assets: assets.map(({name, browser_download_url}) => ({name, browser_download_url}))
              };
            } catch (error) {
              if (error.status !== 404 || process.env.RELEASE_TAG) throw error;
              core.info('No release published yet; keeping the first-release message.');
            }
            fs.writeFileSync('website/downloads.json', JSON.stringify(manifest, null, 2) + '\n');
      - name: Build static landing page
        run: node scripts/build-website.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
      - name: Deploy uploaded Pages artifact
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Pages upload did not return an artifact ID.');
            }
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            let idToken;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                idToken = await core.getIDToken();
                break;
              } catch {
                if (attempt === 3) throw new Error('Could not obtain a Pages deployment identity.');
                await sleep(3000);
              }
            }
            let deployment;
            try {
              ({data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: idToken
              }));
            } catch (error) {
              throw new Error(`GitHub Pages rejected artifact ${artifactId} (HTTP ${error.status ?? 'unknown'}).`);
            }
            const deploymentId = deployment.id ?? deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('GitHub Pages returned no deployment ID.');
            core.setOutput('page_url', deployment.page_url);
            const terminal = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...context.repo, pages_deployment_id: deploymentId
              });
              if (data.status === 'succeed') return;
              if (terminal.has(data.status)) throw new Error(`GitHub Pages deployment ended with ${data.status}.`);
              await sleep(5000);
            }
            throw new Error('Timed out waiting for GitHub Pages to publish.');
