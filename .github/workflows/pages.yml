name: Deploy landing page
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Published release to display
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-22.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify static site
        run: |
          test -f website/index.html
          test -f website/downloads.js
          test -f website/assets/icon.png
          ! grep -q '/src/main.tsx' website/index.html
      - name: Generate public download manifest
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            let manifest = null;
            try {
              const tag = process.env.RELEASE_TAG;
              const response = tag
                ? await github.rest.repos.getReleaseByTag({owner, repo, tag})
                : await github.rest.repos.getLatestRelease({owner, repo});
              const release = response.data;
              if (release.draft || release.prerelease) throw new Error('Release is not published');
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner, repo, release_id: release.id, per_page: 100
              });
              manifest = {
                tag_name: release.tag_name,
                assets: assets.map(({name, browser_download_url}) => ({name, browser_download_url}))
              };
            } catch (error) {
              if (error.status !== 404 || process.env.RELEASE_TAG) throw error;
              core.info('No release published yet; keeping the first-release message.');
            }
            fs.writeFileSync('website/downloads.json', JSON.stringify(manifest, null, 2) + '\n');
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Verify Pages deployment identity
        uses: actions/github-script@v8
        with:
          script: |
            if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
              throw new Error('Pages deployment requires id-token: write on this job and its caller.');
            }
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await core.getIDToken();
                core.info('Pages deployment identity verified.');
                break;
              } catch {
                if (attempt === 3) throw new Error('GitHub OIDC is unavailable after three attempts. Retry this Pages job; desktop installers remain published.');
                core.warning('GitHub OIDC request failed; retrying without exposing token details.');
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
      - uses: actions/deploy-pages@v4
        id: deployment
