name: Release VPS Pilot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Configure the VPS Pilot TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
            exit 1
          fi
      - name: Choose an immutable build tag
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}-build.${context.runNumber}`;
            core.setOutput('tag', tag);
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-release.ts
      - run: bun run check
      - run: bun run build
      - run: bun test
      - name: Check Docker safety policy
        if: runner.os == 'Linux'
        run: python3 tests/fixtures/docker-policy.test.py
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: VPS Pilot ${{ needs.prepare.outputs.tag }}
          releaseBody: |
            Early preview of VPS Pilot. File writes and Docker management require reviewed approvals and native safety checks. Interactive SSH terminals run commands with your normal permissions.
            Windows installers are unsigned. macOS builds use ad-hoc signing and are not notarized.
            See README.md for supported systems and current limitations.
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo});
            const release = releases.find(r => r.tag_name === tag);
            if (!release) throw new Error('Release draft missing');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner, repo, release_id: release.id});
            for (const suffix of ['_amd64.deb', '_amd64.AppImage', '.x86_64.rpm', '_x64-setup.exe', '_x64_en-US.msi', '_aarch64.dmg', '_x64.dmg']) {
              if (!assets.some(a => a.name.endsWith(suffix))) throw new Error('Missing ' + suffix);
            }
            // Keep the manifest version equal to the embedded app version.
            // Immutable -build.N tags identify CI runs, not application versions.
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const notes = fs.readFileSync('release-notes.md', 'utf8').trim();
            if (!notes) throw new Error('release-notes.md must describe the update');
            const entry = async (suffix) => {
              const artifact = assets.find(a => a.name.endsWith(suffix));
              if (!artifact) throw new Error('Missing updater artifact ' + suffix);
              const signatureAsset = assets.find(a => a.name === artifact.name + '.sig');
              if (!signatureAsset) throw new Error('Missing signature for ' + artifact.name);
              const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: signatureAsset.id, headers: {accept: 'application/octet-stream'}
              });
              const signature = Buffer.from(response.data).toString('utf8').trim();
              if (!signature) throw new Error('Empty signature for ' + artifact.name);
              return {signature, url: artifact.browser_download_url};
            };
            const appimage = await entry('_amd64.AppImage');
            const deb = await entry('_amd64.deb');
            const rpm = await entry('.x86_64.rpm');
            const nsis = await entry('_x64-setup.exe');
            const msi = await entry('_x64_en-US.msi');
            const macArm = await entry('_aarch64.app.tar.gz');
            const macIntel = await entry('_x64.app.tar.gz');
            const manifest = {
              version, notes, pub_date: new Date().toISOString(),
              platforms: {
                'linux-x86_64': appimage,
                'linux-x86_64-appimage': appimage,
                'linux-x86_64-deb': deb,
                'linux-x86_64-rpm': rpm,
                'windows-x86_64': nsis,
                'windows-x86_64-nsis': nsis,
                'windows-x86_64-msi': msi,
                'darwin-aarch64': macArm,
                'darwin-aarch64-app': macArm,
                'darwin-x86_64': macIntel,
                'darwin-x86_64-app': macIntel,
              }
            };
            // Stable website URLs must exist before this release can become latest.
            const installerNames = [
              ['_amd64.deb', 'VPS-Pilot-linux-x64.deb'],
              ['_amd64.AppImage', 'VPS-Pilot-linux-x64.AppImage'],
              ['.x86_64.rpm', 'VPS-Pilot-linux-x64.rpm'],
              ['_x64-setup.exe', 'VPS-Pilot-windows-x64-setup.exe'],
              ['_x64_en-US.msi', 'VPS-Pilot-windows-x64.msi'],
              ['_aarch64.dmg', 'VPS-Pilot-macos-apple-silicon.dmg'],
              ['_x64.dmg', 'VPS-Pilot-macos-intel.dmg'],
            ];
            const stableAssets = [];
            for (const [suffix, name] of installerNames) {
              const source = assets.find(a => a.name.endsWith(suffix));
              if (!source) throw new Error('Missing installer ' + suffix);
              const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: source.id, headers: {accept: 'application/octet-stream'}
              });
              const data = Buffer.from(response.data);
              if (!data.length) throw new Error('Empty installer ' + suffix);
              const previous = assets.find(a => a.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: previous.id});
              const result = await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream'}
              });
              stableAssets.push(result.data);
            }
            const oldManifest = assets.find(a => a.name === 'latest.json');
            if (oldManifest) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: oldManifest.id});
            const uploaded = await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: 'latest.json',
              data: Buffer.from(JSON.stringify(manifest, null, 2) + '\n'),
              headers: {'content-type': 'application/json'}
            });
            const stableNames = new Set(installerNames.map(([, name]) => name));
            const releaseAssets = [...assets.filter(a => a.name !== 'latest.json' && !stableNames.has(a.name)), ...stableAssets, uploaded.data];
            const crypto = require('node:crypto');
            const lines = [];
            for (const asset of releaseAssets.filter(a => a.name !== 'SHA256SUMS.txt')) {
              const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}
              });
              const digest = crypto.createHash('sha256').update(Buffer.from(response.data)).digest('hex');
              lines.push(digest + '  ' + asset.name);
            }
            const previous = assets.find(a => a.name === 'SHA256SUMS.txt');
            if (previous) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: previous.id});
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: 'SHA256SUMS.txt',
              data: Buffer.from(lines.join('\n') + '\n'),
              headers: {'content-type': 'text/plain'}
            });
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body: notes + '\n\n' + (release.body || ''), draft: false, prerelease: false, make_latest: "true"});

  deploy-downloads:
    needs: [prepare, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
