[[permission]]
identifier = "setup-keys"
description = "App-owned local encrypted SSH key vault. Bounded listing across the standard ~/.ssh folder and the legacy app vault, strict Ed25519 generation with transient passphrases, explicit no-overwrite copy from the app vault into ~/.ssh, and user-initiated backup export through a native save dialog. No arbitrary local paths, private-key contents, passphrase persistence, or SSH actions."
commands.allow = ["app_setup_keys_list", "app_setup_key_generate", "app_setup_key_use_ssh_directory", "app_setup_key_export"]
