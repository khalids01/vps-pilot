[[permission]]
identifier = "ssh-connection"
description = "Allow saved-profile management, host identity review, and authenticated SSH connection lifecycle. Does not expose remote execution, local shell commands, arbitrary files, or terminal channels."
commands.allow = [
  "ssh_profiles",
  "ssh_config_hosts",
  "ssh_save_profile",
  "ssh_delete_profile",
  "ssh_inspect",
  "ssh_trust",
  "ssh_connect",
  "ssh_disconnect",
  "ssh_statuses",
]
