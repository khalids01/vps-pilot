[package]
name = "vps-pilot"
version = "0.1.0"
description = "A desktop workspace for managing VPS servers."
edition = "2021"
[lib]
name = "vps_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
