[package]
name = "vps-pilot"
version = "0.1.0"
description = "A desktop workspace for managing VPS servers."
edition = "2021"
[lib]
name = "vps_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
ssh2-config = { version = "0.9", default-features = false, features = ["nolog"] }
[dev-dependencies]
rand = "0.10"
