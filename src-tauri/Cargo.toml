[package]
name = "vps-pilot"
version = "0.2.19"
description = "A desktop workspace for managing VPS servers."
edition = "2021"
[lib]
name = "vps_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tempfile = "3"
ssh2-config = { version = "0.9", default-features = false, features = ["nolog"] }
shlex = "2"
url = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
russh-sftp = "3"
sha2 = "0.10"
zip = { version = "9", default-features = false }
rand = "0.10"
argon2 = { version = "0.6", features = ["zeroize"] }
keyring = "4.2"
tauri-plugin-biometry = "=0.2.8"
[target.'cfg(target_os = "linux")'.dependencies]
pam-client = { version = "0.5", default-features = false }
nix = { version = "0.32", features = ["user"] }
[dev-dependencies]
tokio-stream = { version = "0.1.17", features = ["net"] }
